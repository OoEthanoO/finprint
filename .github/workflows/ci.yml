name: tests

on:
  push:
    branches: [main]
  pull_request:

# Tests only. finprint is no longer deployed from CI: it runs on a self-hosted
# Windows laptop behind Caddy, and a GitHub runner has no route to it. Deploys
# happen on that machine with `scripts\selfhost\update.ps1`, which does what the
# old `deploy` job did — pull, install, restart, and refuse to report success
# until /api/health reports the new commit. See DEPLOY.md.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # the version the project targets
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch wheels, same as the self-hosted venv — avoids pulling ~5 GB of CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          # The serving set the host actually installs, so a serving import missing
          # from requirements-serve.txt fails here rather than in production.
          pip install -r requirements-serve.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -q
