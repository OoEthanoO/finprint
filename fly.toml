# Fly.io deployment for finprint.
#   fly launch --copy-config --no-deploy   # first time: creates the app
#   fly deploy                             # build remotely & release
#
# `app` must be globally unique — `fly launch` will offer to rename it.
app = "finprint"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# torch + librosa need real memory; 256 MB (the default) OOMs on model load.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
